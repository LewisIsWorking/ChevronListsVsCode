name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests with coverage
        run: bun run test:coverage

      # Enforces the 100%-coverage policy as a ratchet: fails if coverage drops
      # below the floor in coverage-policy.json. See scripts/coverage-gate.mjs
      # for why Bun's own coverageThreshold cannot express this.
      - name: Coverage gate
        run: node scripts/coverage-gate.mjs

      - name: Compile TypeScript
        run: bun run compile
