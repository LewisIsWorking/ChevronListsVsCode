name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests (istanbul-instrumented)
        run: bun test src/__tests__ --timeout 60000

      # Enforces the 100%-coverage policy (statements, branches, functions,
      # lines) as a ratchet: fails if any metric drops below the floor in
      # coverage-policy.json. Measured by istanbul via scripts/istanbul-preload.ts,
      # because Bun's own reporter emits no branch data at all.
      - name: Coverage gate
        run: node scripts/coverage-gate.mjs

      - name: Compile TypeScript
        run: bun run compile

      # The extension runs from the committed dist/extension.js, so a change to
      # src/ that is not rebuilt never reaches users (26.8.0 nearly shipped
      # without the Archive nesting fix this way). Rebuild and compare.
      - name: Bundle is up to date
        run: |
          bun run bundle:prod
          git diff --exit-code --stat -- dist/extension.js || {
            echo "::error::dist/extension.js is stale: run 'bun run bundle:prod' and commit it"
            exit 1
          }
