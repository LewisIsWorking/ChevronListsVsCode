name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run tests (istanbul-instrumented)
        run: bun test src/__tests__

      # Enforces the 100%-coverage policy (statements, branches, functions,
      # lines) as a ratchet: fails if any metric drops below the floor in
      # coverage-policy.json. Measured by istanbul via scripts/istanbul-preload.ts,
      # because Bun's own reporter emits no branch data at all.
      - name: Coverage gate
        run: node scripts/coverage-gate.mjs

      - name: Compile TypeScript
        run: bun run compile
